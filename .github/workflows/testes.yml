# Testes e auditoria de dependências a cada push e pull request. Sem segredos; só leitura do repositório.
name: testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leitor de PDF (para os testes que conferem o texto do relatório)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Dependências fixadas
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Testes
        run: python -m pytest -o addopts="" -q
      - name: Demonstração ponta a ponta
        run: scripts/demo.sh
      - name: Auditoria de dependências
        run: python -m pip install pip-audit==2.10.1 && pip-audit -r requirements-dev.txt
